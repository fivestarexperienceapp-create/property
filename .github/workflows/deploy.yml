name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for Pages deployments.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs wait instead of cancelling a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests and content checks
        run: npm test

      - name: Read Pages settings
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          # Public address for QR codes, share links and social previews.
          # Follows the repository's Pages URL, including a custom domain.
          # site.publicUrl in src/config/site.ts takes precedence when set.
          SHOWCASE_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
